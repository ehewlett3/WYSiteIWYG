<!doctype html>
<html lang="{{SITE_LANG}}">
<head>
  <meta charset="utf-8">
  <!-- WYSITE:META title="{{TITLE}}" kind="page" excerpt="{{EXCERPT}}" -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} | {{SITE_NAME}}</title>
  <link rel="stylesheet" href="{{THEME_CSS_HREF}}">
  {{HEAD_META}}
</head>
<body class="{{BODY_CLASS}}">
  <div class="parish-shell">
    <header class="parish-header">
      <div class="parish-header__inner">
        <div class="parish-masthead">
          {{SITE_LOGO}}
          <p class="parish-masthead__kicker">{{SITE_TAGLINE}}</p>
          <h1 class="parish-masthead__title">{{SITE_NAME}}</h1>
        </div>
        <nav class="parish-nav" aria-label="Primary">
          <!-- WYSITE:BEGIN name="main-menu" type="menu" label="Main Menu" -->
          {{MAIN_MENU}}
          <!-- WYSITE:END name="main-menu" -->
        </nav>
      </div>
    </header>

    <main class="parish-main">
      <section class="parish-intro">
        <p class="parish-intro__eyebrow">Page</p>
        <h2>{{TITLE}}</h2>
        <p>{{EXCERPT}}</p>
      </section>

      <section class="wysite-page-block">
        <article class="content-block">
          <div class="content-stack">
            {{PAGE_CONTENT_BLOCK}}
          </div>
        </article>
      </section>

      <section class="wysite-page-block">
        <article class="content-block">
          <div class="content-stack">
            {{PAGE_CONTENT_BLOCK}}
          </div>
        </article>
      </section>

      <section class="wysite-page-block">
        <article class="content-block">
          <div class="content-stack">
            {{PAGE_CONTENT_BLOCK}}
          </div>
        </article>
      </section>
    </main>
    <footer class="parish-footer">
      {{FOOTER}}
    </footer>
  </div>
  {{WYSITE_PUBLIC_BRIDGE}}
</body>
</html>
