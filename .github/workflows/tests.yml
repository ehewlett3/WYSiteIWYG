name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, curl, zip
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run the test suite
        run: php edit/tests/run.php

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Editor round-trip (jsdom)
        working-directory: edit/tests/js
        run: |
          npm install --no-save jsdom@24
          node run-node.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, curl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Browser checks (Chromium)
        working-directory: edit/tests/browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node run.mjs
