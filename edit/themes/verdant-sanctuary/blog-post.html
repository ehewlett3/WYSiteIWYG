<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- WYSITE:META title="{{TITLE}}" kind="blog-post" date="{{DATE}}" excerpt="{{EXCERPT}}" hashtags="{{HASHTAGS}}" -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{THEME_CSS_HREF}}">
</head>
<body class="{{BODY_CLASS}}">
  <div class="site-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="/">
          <span class="site-brand__kicker">WYSiteIWYG</span>
          <span class="site-brand__title">Verdant Sanctuary</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <!-- WYSITE:BEGIN name="main-menu" type="menu" label="Main Menu" -->
          {{MAIN_MENU}}
          <!-- WYSITE:END name="main-menu" -->
        </nav>
      </div>
    </header>

    <main>
      <section class="hero hero--post">
        <div class="hero__panel">
          <p class="hero__eyebrow">Journal Entry</p>
          <h1>{{TITLE}}</h1>
          <p>{{EXCERPT}}</p>
          {{TAG_LINKS}}
        </div>
      </section>

      <section class="content-wrap">
        <article class="content-block">
          <div class="post-body">
            <!-- WYSITE:BEGIN name="blog-post-content" type="blog-post" label="Blog Post Content" -->
            {{BLOG_POST_CONTENT}}
            <!-- WYSITE:END name="blog-post-content" -->
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p><a class="text-link" href="/blog/">Back to the journal</a></p>
      </div>
    </footer>
  </div>
  {{WYSITE_PUBLIC_BRIDGE}}
</body>
</html>
