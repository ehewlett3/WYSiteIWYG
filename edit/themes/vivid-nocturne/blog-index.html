<!doctype html>
<html lang="{{SITE_LANG}}">
<head>
  <meta charset="utf-8">
  <!-- WYSITE:META title="{{TITLE}}" kind="blog" excerpt="{{EXCERPT}}" tag="{{TAG}}" generated="tag-index" -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} | {{SITE_NAME}}</title>
  <link rel="stylesheet" href="{{THEME_CSS_HREF}}">
  {{HEAD_META}}
</head>
<body class="{{BODY_CLASS}}">
  <div class="site-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="/">
          {{SITE_LOGO}}
          <span class="site-brand__kicker">{{SITE_TAGLINE}}</span>
          <span class="site-brand__title">{{SITE_NAME}}</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <!-- WYSITE:BEGIN name="main-menu" type="menu" label="Main Menu" -->
          {{MAIN_MENU}}
          <!-- WYSITE:END name="main-menu" -->
        </nav>
      </div>
    </header>

    <main>
      <section class="hero hero--blog">
        <div class="hero__panel">
          <p class="hero__eyebrow">{{TAG_LABEL}}</p>
          <h1>{{TITLE}}</h1>
          <p>{{EXCERPT}}</p>
        </div>
      </section>

      <section class="content-wrap">
        <article class="content-block">
          <div class="content-stack">
            <!-- WYSITE:BEGIN name="blog-index-content" type="blog" label="Blog Index Intro" -->
            {{BLOG_INDEX_CONTENT}}
            <!-- WYSITE:END name="blog-index-content" -->
          </div>
        </article>
      </section>

      <section class="blog-roll">
        {{BLOG_ITEMS}}
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        {{FOOTER}}
      </div>
    </footer>
  </div>
  {{WYSITE_PUBLIC_BRIDGE}}
</body>
</html>
